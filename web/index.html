<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python Learning Quest (Web Prototype)</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Python Learning Quest — Web Prototype</h1>
        <p>Write Python to move the hero to the goal. Click Run.</p>
      </header>
      <main class="layout">
        <section class="canvas-panel">
          <div id="game"></div>
          <div class="status">
            <span id="level-title">Loading...</span>
            <span id="level-requirements"></span>
            <span id="move-counter"></span>
          </div>
        </section>
        <section class="editor-panel">
          <label for="code">Python Code</label>
          <textarea id="code" spellcheck="false"># Example
steps = 2
move("right", steps)
move("down", 2)
move("right", 1)</textarea>
          <div class="controls">
            <button id="run">Run</button>
            <button id="reset">Reset</button>
          </div>
          <pre id="output"></pre>
          <div class="docs" id="docs"></div>
        </section>
      </main>
    </div>
    <script src="main.js"></script>
  </body>
</html>
